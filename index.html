<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Caderno de Estudos — UFMS (Analista de TI)</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #2c3e50;
      --sidebar-bg: #f8f9fa;
      --border-color: #eaecef;
      --quote-bg: #f3f5f7;
      --code-bg: #f6f8fa;
      --accent: #3f51b5;
    }
    body.dark {
      --bg-color: #16181d;
      --text-color: #d8dee9;
      --sidebar-bg: #1c1f26;
      --border-color: #2c313c;
      --quote-bg: #22262f;
      --code-bg: #232731;
      --accent: #7aa2f7;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 16px;
      line-height: 1.65;
    }
    .sidebar {
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      color: var(--text-color);
    }
    .sidebar ul li a { color: var(--text-color); }
    .sidebar ul li.active > a { color: var(--accent); font-weight: 600; }
    .markdown-section {
      max-width: 860px;
      padding: 28px 24px 80px;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section strong {
      color: var(--text-color);
    }
    .markdown-section a { color: var(--accent); }
    .markdown-section blockquote {
      background-color: var(--quote-bg);
      border-left: 4px solid var(--accent);
      color: var(--text-color);
      padding: 10px 16px;
      border-radius: 0 6px 6px 0;
    }
    .markdown-section code, .markdown-section pre {
      background-color: var(--code-bg);
      color: var(--text-color);
    }
    .markdown-section table tr { background-color: var(--bg-color); border-top: 1px solid var(--border-color); }
    .markdown-section table tr:nth-child(2n) { background-color: var(--sidebar-bg); }
    .markdown-section table th, .markdown-section table td { border-color: var(--border-color); }
    .markdown-section input[type="checkbox"] {
      width: 18px;
      height: 18px;
      vertical-align: middle;
      margin-right: 8px;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .floating-toolbar {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 99;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .floating-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    }
    .floating-btn.secondary {
      background: #4c566a;
    }
  </style>
</head>
<body>
  <div id="app">Carregando caderno...</div>

  <div class="floating-toolbar">
    <button id="copy-answers-btn" class="floating-btn" style="display:none;">📋 Copiar respostas</button>
    <button id="clear-checks-btn" class="floating-btn secondary" style="display:none;">🗑️ Limpar</button>
    <button id="theme-toggle-btn" class="floating-btn secondary">🌙 Tema</button>
  </div>

  <script>
    // Tema Claro/Escuro persistido no navegador do tablet
    (function () {
      const savedTheme = localStorage.getItem('caderno_theme') || 'dark';
      if (savedTheme === 'dark') document.body.classList.add('dark');
      const btn = document.getElementById('theme-toggle-btn');
      const syncLabel = () => {
        btn.textContent = document.body.classList.contains('dark') ? '☀️ Claro' : '🌙 Escuro';
      };
      syncLabel();
      btn.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        localStorage.setItem('caderno_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        syncLabel();
      });
    })();

    // Plugin Docsify para tornar checkboxes interativos com persistência em localStorage
    function interactiveCheckboxesPlugin(hook) {
      hook.doneEach(function () {
        const route = location.hash.split('?')[0] || '#/';
        const storageKey = 'caderno_checks::' + route;
        const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
        const boxes = Array.from(document.querySelectorAll('.markdown-section input[type="checkbox"]'));

        const copyBtn = document.getElementById('copy-answers-btn');
        const clearBtn = document.getElementById('clear-checks-btn');
        const isQuestoes = route.includes('questoes/') || boxes.length >= 10;

        copyBtn.style.display = isQuestoes && boxes.length ? 'inline-block' : 'none';
        clearBtn.style.display = isQuestoes && boxes.length ? 'inline-block' : 'none';

        boxes.forEach((box, idx) => {
          box.disabled = false;
          if (typeof saved[idx] === 'boolean') {
            box.checked = saved[idx];
          }
          box.addEventListener('change', () => {
            saved[idx] = box.checked;
            localStorage.setItem(storageKey, JSON.stringify(saved));
          });
        });

        clearBtn.onclick = () => {
          localStorage.removeItem(storageKey);
          boxes.forEach(b => { b.checked = false; });
        };

        copyBtn.onclick = async () => {
          const checkedTexts = boxes
            .filter(b => b.checked)
            .map(b => (b.parentElement ? b.parentElement.innerText.trim() : ''))
            .filter(Boolean);
          const payload = checkedTexts.length
            ? 'Minhas marcações:\n' + checkedTexts.map(t => '- ' + t).join('\n')
            : 'Nenhuma alternativa marcada ainda.';
          try {
            await navigator.clipboard.writeText(payload);
            const old = copyBtn.textContent;
            copyBtn.textContent = '✅ Copiado!';
            setTimeout(() => { copyBtn.textContent = old; }, 1500);
          } catch {
            alert(payload);
          }
        };
      });
    }

    window.$docsify = {
      name: '📚 Caderno UFMS',
      homepage: 'CRONOGRAMA_ESTUDOS.md',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Buscar no caderno...',
        noData: 'Nada encontrado',
        depth: 3
      },
      plugins: [interactiveCheckboxesPlugin]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
